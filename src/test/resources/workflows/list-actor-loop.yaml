name: list-actor-loop
steps:
  - states: ["0", "1"]
    actions:
      - actor: this
        method: appendJson
        arguments:
          path: items
          value: "Apple"
      - actor: this
        method: appendJson
        arguments:
          path: items
          value: "Banana"
      - actor: this
        method: appendJson
        arguments:
          path: items
          value: "Cherry"
  - states: ["1", "loop"]
    actions:
      - actor: this
        method: putJson
        arguments:
          path: i
          value: 0
  - states: ["loop", "process"]
    actions:
      - actor: this
        method: onlyIf
        arguments: "jexl: state.getInt('i', 0) < state.select('items').size()"
      - actor: this
        method: appendJson
        arguments:
          path: seen
          value: "jexl: state.select('items').get(state.getInt('i', 0)).asText()"
  - states: ["loop", "end"]
    actions:
      - actor: out
        method: print
        arguments:
          message: "All items processed."
  - states: ["process", "loop"]
    actions:
      - actor: this
        method: putJson
        arguments:
          path: count
          value: "jexl: state.getInt('count', 0) + 1"
      - actor: this
        method: putJson
        arguments:
          path: i
          value: "jexl: state.getInt('i', 0) + 1"
