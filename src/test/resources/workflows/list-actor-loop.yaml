name: list-actor-loop
steps:
  - states: ["0", "1"]
    actions:
      - actor: list:items
        method: add
        arguments:
          value: "Apple"
      - actor: list:items
        method: add
        arguments:
          value: "Banana"
      - actor: list:items
        method: add
        arguments:
          value: "Cherry"
  - states: ["1", "loop"]
    actions:
      - actor: calc:i
        method: set
        arguments:
          value: 0
  - states: ["loop", "process"]
    actions:
      - actor: list:items
        method: get
        arguments:
          index: "jexl: actors.get('calc:i').get()"
  - states: ["loop", "end"]
    actions:
      - actor: out
        method: print
        arguments:
          message: "All items processed."
  - states: ["process", "loop"]
    actions:
      - actor: calc:count
        method: inc
      - actor: calc:i
        method: inc
