name: multi-state-loop-workflow
steps:
  - states: ["0", "s1"]
    actions:
      - actor: cycleActor
        method: phase1

  - states: ["s1", "s2"]
    actions:
      - actor: cycleActor
        method: phase2

  - states: ["s2", "s3"]
    actions:
      - actor: cycleActor
        method: phase3

  - states: ["s3", "s1"]
    actions:
      - actor: cycleActor
        method: checkContinue
      - actor: cycleActor
        method: phase1

  - states: ["s3", "end"]
    actions:
      - actor: cycleActor
        method: finalize
