name: loop-pattern-workflow
steps:
  - states: ["0", "loop"]
    actions:
      - actor: loopActor
        method: increment
  - states: ["loop", "loop"]
    actions:
      - actor: loopActor
        method: checkLimit
      - actor: loopActor
        method: increment
  - states: ["loop", "end"]
    actions:
      - actor: loopActor
        method: finish
