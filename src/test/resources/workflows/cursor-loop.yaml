name: cursor-loop
steps:
  - states: ["0", "loop"]
    actions:
      - actor: this
        method: putJson
        arguments:
          path: count
          value: 0
  - states: ["loop", "process"]
    actions:
      - actor: cursorActor
        method: getNext
  - states: ["loop", "end"]
    actions:
      - actor: out
        method: print
        arguments:
          message: "All items processed."
  - states: ["process", "loop"]
    actions:
      - actor: this
        method: putJson
        arguments:
          path: count
          value: "jexl: state.getInt('count', 0) + 1"
