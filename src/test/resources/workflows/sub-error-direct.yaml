name: sub-error-direct
description: |
  A sub-workflow whose DIRECT action throws. The action must be false, and the fallback
  transition must read the reason from the last result.
steps:
  - states: ["0", "connected"]
    actions:
      - actor: net
        method: connect
        execution: DIRECT
  - states: ["0", "recorded"]
    actions:
      - actor: recorder
        method: record
        arguments: ["jexl: result"]
  - states: ["recorded", "end"]
    actions:
      - actor: this
        method: doNothing
