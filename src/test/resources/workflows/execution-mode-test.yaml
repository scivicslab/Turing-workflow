name: execution-mode-test
steps:
  - states: ["0", "1"]
    actions:
      - actor: math
        method: add
        arguments:
          a: 10
          b: 5
  - states: ["1", "2"]
    actions:
      - actor: math
        method: multiply
        arguments:
          a: 3
          b: 4
        execution: POOL
  - states: ["2", "end"]
    actions:
      - actor: math
        method: getLastResult
        execution: DIRECT
