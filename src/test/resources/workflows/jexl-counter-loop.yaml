name: jexl-counter-loop
steps:
  - states: ["jexl:n < 5", "jexl:n + 1"]
    actions:
      - actor: this
        method: putJson
        arguments:
          path: count
          value: "jexl: state.getInt('count', 0) + 1"
  - states: ["jexl:n >= 5", "end"]
    actions:
      - actor: out
        method: print
        arguments:
          message: "Loop finished."
